name: Build Watchface Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Zepp OS Watchface (.zab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Zeus CLI
        run: npm install -g @zeppos/zeus-cli

      - name: Install project dependencies
        run: npm install

      - name: Build Watchface Package
        run: zeus build

      - name: Upload Watchface Bundle Artifact (.zab)
        uses: actions/upload-artifact@v4
        with:
          name: mandelbrot-watchface-bundle
          path: dist/*.zab
          if-no-files-found: error
